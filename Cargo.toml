[package]
name = "cvenv"
version = "0.5.0"
edition = "2021"
description = "pixi environments packed into single-file images (Apptainer or squashfuse)"
license = "Apache-2.0"
repository = "https://github.com/amarchakitus/cvenv"
homepage = "https://github.com/amarchakitus/cvenv"
readme = "README.md"
keywords = ["pixi", "conda", "apptainer", "hpc", "squashfs"]
categories = ["command-line-utilities", "development-tools", "science"]
rust-version = "1.88"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
glob = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
