[package]
name = "cvenv"
version = "0.4.2"
edition = "2021"
description = "pixi environments packed into single-file images (Apptainer or squashfuse)"
license = "Apache-2.0"
rust-version = "1.87"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
glob = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
