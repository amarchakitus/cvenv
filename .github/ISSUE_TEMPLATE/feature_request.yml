name: Feature request
description: Suggest a new feature or a change to existing behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard with cvenv today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work, e.g. the command or setting you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you have considered.
  - type: input
    id: environment
    attributes:
      label: Cluster and backend
      description: If relevant, the scheduler and backend (apptainer or squashfuse) you use.
