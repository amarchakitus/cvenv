# Build static Linux binaries and attach them to a GitHub release.
# Trigger: push a tag like v0.2.0 (or run manually to just get artifacts).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8
        with:
          cache: true
      - name: Build (static, same script as `pixi run build`)
        run: pixi run build
      - name: Check the binary is static and runs
        run: |
          file bin/cvenv
          ! ldd bin/cvenv 2>/dev/null | grep -q '=>'
          bin/cvenv --version
      - name: Package
        run: |
          mkdir -p dist
          cp bin/cvenv dist/cvenv-${{ matrix.triple }}
          (cd dist && sha256sum cvenv-${{ matrix.triple }} > cvenv-${{ matrix.triple }}.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: cvenv-${{ matrix.triple }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
