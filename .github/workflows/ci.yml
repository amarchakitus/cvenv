# Test and build static Linux binaries (x86_64 + aarch64) on every push and PR.
# Pushing a tag like v0.5.0 also attaches the binaries to a GitHub release, with
# build provenance attestations; running it manually just produces the artifacts.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new push to a PR cancels its older run; main and tags always run to completion
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2   # the version that wrote pixi.lock
          cache: true
          activate-environment: true   # so rust-cache keys on pixi's rustc
      - name: Keep cargo state where rust-cache looks for it
        run: |
          echo "CVENV_CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "CVENV_CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt + clippy
        run: pixi run lint
      - name: shellcheck   # pinned: the runner's preinstalled version differs
        run: pixi exec --spec shellcheck==0.11.0 shellcheck installation.sh scripts/*.sh

  # The oldest Rust that builds the locked dependencies: Cargo.toml's rust-version.
  # A dependency bump that needs a newer Rust fails here (raise rust-version, and
  # the lower bound in pixi.toml, deliberately).
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          [ -n "$v" ] || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --all-targets
      - run: cargo test --locked

  binaries:
    name: binary (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2   # the version that wrote pixi.lock
          cache: true
          activate-environment: true   # so rust-cache keys on pixi's rustc
      - name: Keep cargo state where rust-cache looks for it
        run: |
          echo "CVENV_CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "CVENV_CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pixi run test
      - name: Build (static, same script as `pixi run build`)
        run: pixi run build
      - name: Check the binary is static and runs
        run: |
          file bin/cvenv
          if ldd bin/cvenv 2>/dev/null | grep -q '=>'; then
            echo "::error::bin/cvenv is dynamically linked"; ldd bin/cvenv; exit 1
          fi
          bin/cvenv --version
          bin/cvenv --help >/dev/null
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          got="$(bin/cvenv --version)"
          want="cvenv ${GITHUB_REF_NAME#v}"
          if [ "$got" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME but binary reports '$got' (bump Cargo.toml)"; exit 1
          fi
      - name: Package
        run: |
          mkdir -p dist
          cp bin/cvenv dist/cvenv-${{ matrix.triple }}
          (cd dist && sha256sum cvenv-${{ matrix.triple }} > cvenv-${{ matrix.triple }}.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: cvenv-${{ matrix.triple }}
          path: dist/*
          retention-days: 7

  # The real workflows (scripts/e2e.sh) with the release binaries built above: both backends
  # on x86_64, and squashfuse on aarch64 (catches x86-only assumptions, e.g. linux-64 manifests).
  e2e:
    name: e2e (${{ matrix.backend }}, ${{ matrix.arch }})
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: squashfuse, arch: x86_64, runner: ubuntu-24.04 }
          - { backend: apptainer, arch: x86_64, runner: ubuntu-24.04 }
          - { backend: squashfuse, arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cvenv-${{ matrix.arch }}-unknown-linux-gnu
          path: dist
      - name: Install the binary under test
        run: |
          (cd dist && sha256sum -c cvenv-${{ matrix.arch }}-unknown-linux-gnu.sha256)
          install -D -m 755 dist/cvenv-${{ matrix.arch }}-unknown-linux-gnu "$RUNNER_TEMP/bin/cvenv"
      - uses: prefix-dev/setup-pixi@v0.11.3   # pixi only: the test needs no build env
        with:
          pixi-version: v0.84.2
          run-install: false
      - name: Install squashfuse
        if: matrix.backend == 'squashfuse'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q squashfuse fuse3 squashfs-tools
      - name: Install Apptainer
        if: matrix.backend == 'apptainer'
        env:
          APPTAINER_VERSION: 1.5.5   # the .deb from the GitHub release (the PPA is often unavailable)
        run: |
          deb="apptainer_${APPTAINER_VERSION}_amd64.deb"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$deb" \
            "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/$deb"
          sudo apt-get update -q
          sudo apt-get install -y -q "$RUNNER_TEMP/$deb"
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          apptainer --version
      - name: scripts/e2e.sh
        run: bash scripts/e2e.sh "$RUNNER_TEMP/bin/cvenv"
        env:
          CVENV_E2E_BACKEND: ${{ matrix.backend }}

  # The `build` check is required on main (repository ruleset); it passes only if
  # every job above passed, so new jobs don't need a ruleset change.
  build:
    needs: [lint, msrv, binaries, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: echo "::error::a required job did not pass" && exit 1
      - run: echo "all jobs passed"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write       # create the release
      id-token: write       # Sigstore certificate for the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # signed SLSA build provenance for the binaries (not the .sha256 files);
      # verify with `gh attestation verify cvenv-<triple> --repo <owner>/cvenv`
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/cvenv-*-unknown-linux-gnu
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
