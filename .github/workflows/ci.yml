# Test and build static Linux binaries (x86_64 + aarch64) on every push and PR.
# Pushing a tag like v0.5.0 also attaches the binaries to a GitHub release;
# running it manually just produces the artifacts.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2   # the version that wrote pixi.lock
          cache: true
      - name: rustfmt + clippy
        run: pixi run lint
      - name: shellcheck   # preinstalled on GitHub's Ubuntu runners
        run: shellcheck installation.sh scripts/*.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2   # the version that wrote pixi.lock
          cache: true
      - run: pixi run test
      - name: Build (static, same script as `pixi run build`)
        run: pixi run build
      - name: Check the binary is static and runs
        run: |
          file bin/cvenv
          if ldd bin/cvenv 2>/dev/null | grep -q '=>'; then
            echo "::error::bin/cvenv is dynamically linked"; ldd bin/cvenv; exit 1
          fi
          bin/cvenv --version
          bin/cvenv --help >/dev/null
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          got="$(bin/cvenv --version)"
          want="cvenv ${GITHUB_REF_NAME#v}"
          if [ "$got" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME but binary reports '$got' (bump Cargo.toml)"; exit 1
          fi
      - name: Package
        run: |
          mkdir -p dist
          cp bin/cvenv dist/cvenv-${{ matrix.triple }}
          (cd dist && sha256sum cvenv-${{ matrix.triple }} > cvenv-${{ matrix.triple }}.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: cvenv-${{ matrix.triple }}
          path: dist/*
          retention-days: 7

  release:
    needs: [lint, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
