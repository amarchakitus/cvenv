name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8
        with:
          cache: true
      - run: pixi run test
      - run: pixi run build && bin/cvenv --version && bin/cvenv --help >/dev/null
